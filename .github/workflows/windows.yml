name: Windows C++ build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone --depth=1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure CMake x64
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Test stereo FFT band configuration
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpectrumWall-windows-x64
          path: |
            build/Release/SpectrumWall.exe
            build/Release/SDL3.dll
          if-no-files-found: warn
